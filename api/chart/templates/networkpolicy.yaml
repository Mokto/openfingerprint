{{- if .Values.networkPolicy.enabled }}
{{- if or (not (kindIs "slice" .Values.networkPolicy.apiFrom)) (empty .Values.networkPolicy.apiFrom) }}
{{- fail "networkPolicy.apiFrom must list the peers allowed to call the API" }}
{{- end }}
{{- if not (kindIs "slice" .Values.networkPolicy.redisTo) }}
{{- fail "networkPolicy.redisTo must be a list of Redis peers" }}
{{- end }}
{{- if or (lt (int .Values.networkPolicy.redisPort) 1) (gt (int .Values.networkPolicy.redisPort) 65535) (ne (toString .Values.networkPolicy.redisPort) (toString (int .Values.networkPolicy.redisPort))) }}
{{- fail "networkPolicy.redisPort must be an integer from 1 to 65535" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "of.name" . }}-api
  labels:
    {{- include "of.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "of.apiSelector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.apiFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8180
    {{- if and .Values.metrics.enabled .Values.networkPolicy.metricsFrom }}
    - from:
        {{- toYaml .Values.networkPolicy.metricsFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.metrics.port }}
    {{- end }}
  {{- if or (not (kindIs "slice" .Values.networkPolicy.dnsTo)) (empty .Values.networkPolicy.dnsTo) }}
  {{- fail "networkPolicy.dnsTo must list the DNS servers the API may query" }}
  {{- end }}
  {{- if or (not (kindIs "slice" .Values.networkPolicy.rdapTo)) (empty .Values.networkPolicy.rdapTo) }}
  {{- fail "networkPolicy.rdapTo must list the RDAP registries the API may reach" }}
  {{- end }}
  # MX and registry-host lookups through cluster DNS, RDAP over HTTPS, and Redis. Nothing else.
  egress:
    - to:
        {{- toYaml .Values.networkPolicy.dnsTo | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
    - to:
        {{- toYaml .Values.networkPolicy.rdapTo | nindent 8 }}
      ports:
        - protocol: TCP
          port: 443
    {{- if (index .Values "redis-ha" "enabled") }}
    - to:
        - podSelector:
            matchLabels:
              app: redis-ha-haproxy
              release: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 6379
    {{- else }}
    {{- if empty .Values.networkPolicy.redisTo }}
    {{- fail "networkPolicy.redisTo must list the peers of your Redis when redis-ha is disabled" }}
    {{- end }}
    - to:
        {{- toYaml .Values.networkPolicy.redisTo | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.redisPort }}
    {{- end }}
{{- if .Values.domainData.refresh.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "of.dataName" . }}
  labels:
    {{- include "of.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "of.updaterSelector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
        {{- range .Values.networkPolicy.kubeApiServerPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- end }}
{{- end }}
