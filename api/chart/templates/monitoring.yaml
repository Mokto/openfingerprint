{{- $selector := printf "namespace=%q,service=%q" .Release.Namespace (include "of.name" .) }}
{{- if and .Values.metrics.enabled .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "of.name" . }}
  labels:
    {{- include "of.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "of.apiSelector" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
---
{{- end }}
{{- if and .Values.metrics.enabled .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "of.name" . }}
  labels:
    {{- include "of.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: openfingerprint-domain-data
      rules:
        - alert: OpenFingerprintDomainDataUnavailable
          expr: openfingerprint_domain_data_loaded{ {{- $selector -}} } == 0 or absent(openfingerprint_domain_data_loaded{ {{- $selector -}} })
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: OpenFingerprint has no valid domain snapshot
            description: Domain checks return unknown. Check the {{ include "of.dataName" . }} CronJob and ConfigMap in {{ .Release.Namespace }}.
        - alert: OpenFingerprintDomainSourceExpired
          expr: openfingerprint_domain_data_source_expiry_timestamp_seconds{ {{- $selector -}} } <= time()
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: {{ `OpenFingerprint domain source {{ $labels.source }} expired` }}
            description: The source no longer contributes to domain checks, which report it as stale.
        - alert: OpenFingerprintDomainSourceExpiring
          expr: openfingerprint_domain_data_source_expiry_timestamp_seconds{ {{- $selector -}} } - time() < {{ .Values.prometheusRule.expiryWarningDays }} * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: {{ `OpenFingerprint domain source {{ $labels.source }} expires in {{ $value | humanizeDuration }}` }}
            description: Feed sources mean the refresh CronJob has failed repeatedly. Reviewed sources need a person to re-review their evidence and dates.
        - alert: OpenFingerprintDomainDataReloadFailing
          expr: increase(openfingerprint_domain_data_reload_failures_total{ {{- $selector -}} }[1h]) > 0
          labels:
            severity: warning
          annotations:
            summary: OpenFingerprint rejected a changed domain snapshot
            description: The API keeps serving its last valid snapshot until those sources expire.
        {{- if .Values.countryData.enabled }}
        - alert: OpenFingerprintCountryDataUnavailable
          expr: openfingerprint_country_data_loaded{ {{- $selector -}} } == 0 or absent(openfingerprint_country_data_loaded{ {{- $selector -}} })
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: OpenFingerprint has no country database
            description: Check the country-updater sidecar and its HTTPS egress.
        - alert: OpenFingerprintCountryDataExpiring
          expr: openfingerprint_country_data_expiry_timestamp_seconds{ {{- $selector -}} } - time() < {{ .Values.prometheusRule.expiryWarningDays }} * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: OpenFingerprint country database is expiring or expired
            description: The updater has not installed a recent release. Expired country results stay unknown.
        - alert: OpenFingerprintCountryDataReloadFailing
          expr: increase(openfingerprint_country_data_reload_failures_total{ {{- $selector -}} }[1h]) > 0
          labels:
            severity: warning
          annotations:
            summary: OpenFingerprint rejected a changed country database
            description: The API retains the last valid database until it expires.
        {{- end }}
    - name: openfingerprint-lookups
      rules:
        - alert: OpenFingerprintRedisErrors
          expr: sum(increase(openfingerprint_rdap_cache_total{ {{- $selector -}} ,result="error"}[15m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: OpenFingerprint cannot use its Redis
            description: Registration lookups bypass the cache and reach registries on every check, and token replay checks are unknown. Check the Redis pods, credentials and egress on the Redis port.
        - alert: OpenFingerprintMxLookupsFailing
          expr: |
            sum(increase(openfingerprint_mx_lookups_total{ {{- $selector -}} ,result="unavailable"}[30m])) / sum(increase(openfingerprint_mx_lookups_total{ {{- $selector -}} }[30m])) > 0.5
            and sum(increase(openfingerprint_mx_lookups_total{ {{- $selector -}} }[30m])) >= {{ .Values.prometheusRule.minLookups }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: {{ `Most OpenFingerprint MX lookups fail ({{ $value | humanizePercentage }})` }}
            description: MX facts and inferred disposable or public-mailbox results are unavailable. Check the configured nameserver and UDP 53 egress to it.
        - alert: OpenFingerprintRegistryLookupsFailing
          expr: |
            sum(increase({__name__=~"openfingerprint_(rdap|whois)_lookups_total", {{- $selector -}} ,result="unavailable"}[30m])) / sum(increase({__name__=~"openfingerprint_(rdap|whois)_lookups_total", {{- $selector -}} }[30m])) > 0.5
            and sum(increase({__name__=~"openfingerprint_(rdap|whois)_lookups_total", {{- $selector -}} }[30m])) >= {{ .Values.prometheusRule.minLookups }}
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: {{ `Most OpenFingerprint registry lookups fail ({{ $value | humanizePercentage }})` }}
            description: Registration dates are unavailable. Check TCP 443 and 43 egress to public addresses; a single throttling registry rarely explains a majority.
    {{- if or .Values.networkData.existingClaim .Values.networkData.sidecar.enabled }}
    - name: openfingerprint-network-data
      rules:
        - alert: OpenFingerprintNetworkSourceUnavailable
          expr: openfingerprint_network_data_source_fresh{ {{- $selector -}} } == 0 or absent(openfingerprint_network_data_source_fresh{ {{- $selector -}} })
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: OpenFingerprint network evidence is missing, expired or future-dated
            description: Check the network refresh (the network-updater sidecar's logs, or the network-data CronJob and shared volume) and source availability; unknown is not a clean result.
        - alert: OpenFingerprintNetworkDataReloadFailing
          expr: increase(openfingerprint_network_data_reload_failures_total{ {{- $selector -}} }[1h]) > 0
          labels:
            severity: warning
          annotations:
            summary: OpenFingerprint rejected a changed network snapshot
            description: The last valid snapshot stays loaded without extending source expiry.
    {{- end }}
{{- end }}
