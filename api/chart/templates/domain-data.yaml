{{- define "of.domainUpdaterPod" -}}
metadata:
  labels:
    {{- include "of.updaterSelector" . | nindent 4 }}
spec:
  serviceAccountName: {{ include "of.dataName" . }}
  automountServiceAccountToken: true
  restartPolicy: Never
  securityContext:
    {{- include "of.podSecurity" . | nindent 4 }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: updater
      image: {{ include "of.image" (dict "image" .Values.domainData.refresh.image "appVersion" .Chart.AppVersion) | quote }}
      imagePullPolicy: {{ .Values.domainData.refresh.image.pullPolicy }}
      args: ["--configmap", {{ include "of.dataName" . | quote }}]
      env:
        - name: NODE_EXTRA_CA_CERTS
          value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      securityContext:
        {{- include "of.containerSecurity" . | nindent 8 }}
      resources:
        {{- toYaml .Values.domainData.refresh.resources | nindent 8 }}
  {{- with .Values.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.domainData.refresh.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "of.dataName" . }}
  labels:
    {{- include "of.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "of.dataName" . }}
  labels:
    {{- include "of.labels" . | nindent 4 }}
rules:
  # Kubernetes cannot scope create to a name; changing an existing ConfigMap is limited to this one.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ include "of.dataName" . | quote }}]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "of.dataName" . }}
  labels:
    {{- include "of.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "of.dataName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "of.dataName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "of.dataName" . }}
  labels:
    {{- include "of.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.domainData.refresh.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        {{- include "of.domainUpdaterPod" . | nindent 8 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "of.dataName" . }}-initial
  labels:
    {{- include "of.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    {{- include "of.domainUpdaterPod" . | nindent 4 }}
{{- end }}
