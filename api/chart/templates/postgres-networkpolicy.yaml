{{- if and .Values.postgres.enabled .Values.networkPolicy.enabled }}
{{- if or (not (kindIs "slice" .Values.networkPolicy.postgresTo)) (empty .Values.networkPolicy.postgresTo) }}
{{- fail "networkPolicy.postgresTo must list the PostgreSQL peers" }}
{{- end }}
{{- if or (lt (int .Values.networkPolicy.postgresPort) 1) (gt (int .Values.networkPolicy.postgresPort) 65535) (ne (toString .Values.networkPolicy.postgresPort) (toString (int .Values.networkPolicy.postgresPort))) }}
{{- fail "networkPolicy.postgresPort must be an integer from 1 to 65535" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "of.name" . }}-postgres
  labels:
    {{- include "of.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [openfingerprint, openfingerprint-visitor-migrations]
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        {{- toYaml .Values.networkPolicy.postgresTo | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.postgresPort }}
    - to:
        {{- toYaml .Values.networkPolicy.dnsTo | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
