apiVersion: v1
kind: Service
metadata:
  name: {{ include "of.name" . }}
  labels:
    {{- include "of.labels" . | nindent 4 }}
    app.kubernetes.io/name: openfingerprint
spec:
  type: ClusterIP
  selector:
    {{- include "of.apiSelector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "of.name" . }}-identify
  labels:
    {{- include "of.labels" . | nindent 4 }}
    app.kubernetes.io/name: openfingerprint-identify
  {{- with .Values.identify.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.identify.service.type }}
  selector:
    {{- include "of.apiSelector" . | nindent 4 }}
  ports:
    - name: identify
      port: {{ .Values.identify.service.port }}
      targetPort: identify
