{{- if and (not (index .Values "redis-ha").enabled) (not .Values.existingSecret) }}{{ fail "existingSecret must name the Secret holding OPENFINGERPRINT_REDIS_URL when redis-ha.enabled=false" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "of.name" . }}
  labels:
    {{- include "of.labels" . | nindent 4 }}
    app.kubernetes.io/name: openfingerprint
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "of.apiSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "of.apiSelector" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      # The API resolves only public registry hosts: skip the cluster search domains.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      terminationGracePeriodSeconds: 10
      securityContext:
        {{- include "of.podSecurity" . | nindent 8 }}
        {{- if or .Values.countryData.enabled .Values.networkData.sidecar.enabled }}
        fsGroup: 65532
        {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "of.image" (dict "image" .Values.image "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8180
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          env:
            - name: OPENFINGERPRINT_LISTEN_ADDR
              value: 0.0.0.0:8180
            {{- with .Values.sentry.dsn }}
            - name: SENTRY_DSN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.sentry.environment }}
            - name: SENTRY_ENVIRONMENT
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.nonce.required }}
            - name: OPENFINGERPRINT_REQUIRE_NONCE
              value: "true"
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: OPENFINGERPRINT_METRICS_ADDR
              value: "0.0.0.0:{{ .Values.metrics.port }}"
            {{- end }}
            {{- $redis := index .Values "redis-ha" }}
            {{- if $redis.enabled }}
            - name: OPENFINGERPRINT_REDIS_URL
              value: "redis://{{ include "of.redisName" . }}-haproxy:6379/0"
            {{- if $redis.auth }}
            - name: OPENFINGERPRINT_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $redis.existingSecret | default (include "of.redisName" .) | quote }}
                  key: {{ $redis.authKey | default "auth" | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.domainData.refresh.enabled }}
            - name: OPENFINGERPRINT_DOMAIN_DATA
              value: /domain-data/domains.json
            - name: OPENFINGERPRINT_DOMAIN_DATA_RELOAD_SECONDS
              value: {{ .Values.domainData.reloadSeconds | quote }}
            {{- end }}
            {{- if .Values.countryData.enabled }}
            - name: OPENFINGERPRINT_COUNTRY_DATA
              value: /country-data/country.mmdb
            {{- end }}
            {{- if or .Values.networkData.existingClaim .Values.networkData.sidecar.enabled }}
            - name: OPENFINGERPRINT_NETWORK_DATA
              value: /network-data/network.json
            {{- end }}
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret | quote }}
          {{- end }}
          securityContext:
            {{- include "of.containerSecurity" . | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.domainData.refresh.enabled .Values.countryData.enabled .Values.networkData.existingClaim .Values.networkData.sidecar.enabled }}
          volumeMounts:
            {{- if .Values.domainData.refresh.enabled }}
            - name: domain-data
              mountPath: /domain-data
              readOnly: true
            {{- end }}
            {{- if or .Values.networkData.existingClaim .Values.networkData.sidecar.enabled }}
            - name: network-data
              mountPath: /network-data
              readOnly: true
            {{- end }}
            {{- if .Values.countryData.enabled }}
            - name: country-data
              mountPath: /country-data
              readOnly: true
            {{- end }}
          {{- end }}
        {{- if .Values.countryData.enabled }}
        - name: country-updater
          image: {{ include "of.image" (dict "image" .Values.domainData.refresh.image "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.domainData.refresh.image.pullPolicy }}
          command: ["/nodejs/bin/node", "/app/update-country-data.mjs"]
          args: ["--output", "/country-data/country.mmdb", "--loop"]
          securityContext:
            {{- include "of.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.countryData.resources | nindent 12 }}
          volumeMounts:
            - name: country-data
              mountPath: /country-data
        {{- end }}
        {{- if .Values.networkData.sidecar.enabled }}
        - name: network-updater
          image: {{ include "of.image" (dict "image" .Values.networkData.refresh.image "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.networkData.refresh.image.pullPolicy }}
          args: ["--output", "/network-data/network.json", "--loop"]
          securityContext:
            {{- include "of.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.networkData.sidecar.resources | nindent 12 }}
          volumeMounts:
            - name: network-data
              mountPath: /network-data
        {{- end }}
      {{- if or .Values.domainData.refresh.enabled .Values.countryData.enabled .Values.networkData.existingClaim .Values.networkData.sidecar.enabled }}
      volumes:
        {{- if .Values.countryData.enabled }}
        - name: country-data
          emptyDir:
            sizeLimit: 96Mi
        {{- end }}
        {{- if .Values.domainData.refresh.enabled }}
        # Optional: until the first refresh creates it, domain facts are unknown, not bundled.
        - name: domain-data
          configMap:
            name: {{ include "of.dataName" . }}
            optional: true
        {{- end }}
        {{- if .Values.networkData.sidecar.enabled }}
        - name: network-data
          emptyDir:
            sizeLimit: {{ .Values.networkData.sidecar.sizeLimit }}
        {{- else if .Values.networkData.existingClaim }}
        - name: network-data
          persistentVolumeClaim:
            claimName: {{ .Values.networkData.existingClaim | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if .Values.onePodPerNode }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "of.apiSelector" . | nindent 18 }}
      {{- end }}
