[package]
name = "openfingerprint-api"
version = "0.6.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum = "0.8.9"
psl = "2.1.248"
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "tls12"] }
redis = { version = "1.8.1", default-features = false, features = ["tokio-rustls-comp", "script"] }
url = "2.5.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
