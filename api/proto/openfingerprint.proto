syntax = "proto3";

package openfingerprint.v1;

// The same compact verdicts as the internal POST /v1/check, on the same listener, over
// Connect (JSON or protobuf, any HTTP version), gRPC and gRPC-Web. With `detail`, the
// response also carries the identification evidence behind them. gRPC needs
// HTTP/2 without TLS here. There is no authentication: keep the API on a
// private network. Server reflection is available.
service OpenFingerprint {
  rpc Check(CheckRequest) returns (CheckResponse);
}

// At least one field is required. `domain` and `email` are mutually exclusive.
message CheckRequest {
  reserved 1, 5;
  reserved "signals", "headers";
  // The `identificationId` the browser got from the public `POST /v1/identify`.
  optional string identification_id = 6;
  optional string domain = 2;
  optional string email = 3;
  optional string ip = 4;
  // Adds `identification` to the response. The compact fields stay the same.
  optional bool detail = 7;
}

// An unset field means unknown, not false.
message CheckResponse {
  // Unset when the identification is unknown, expired or invalid, or has no full ID.
  optional string fingerprint = 1;
  optional bool automation = 2;
  optional bool tampering = 3;
  // The browser's own report (user agent, client hints, language) contradicts
  // the request the identify listener received: its headers or its TLS
  // handshake. Unset when nothing could be compared.
  optional bool spoofing = 18;
  optional bool disposable = 4;
  optional bool free = 5;
  optional bool spam = 6;
  optional bool relay = 7;
  optional bool mx = 8;
  // The domain is on a generic TLD that registrars sell at teaser prices (a first-year price of 3 USD
  // or less). Context for review, not a verdict on the site. Unset for a TLD without a known price.
  optional bool cheap_tld = 15;
  reserved 17;
  reserved "token_age_ms";
  // This identification was looked up before. Unset when Redis cannot say.
  optional bool replayed = 16;
  // Milliseconds since the identification was stored, by the API's clock.
  optional int64 age_ms = 20;
  // Lowercase ISO 3166-1 alpha-2 code.
  optional string country = 9;
  optional bool vpn = 10;
  optional bool tor = 11;
  optional bool datacenter = 12;
  optional bool proxy = 13;
  // Inputs that were rejected: identificationId (malformed, unknown or expired),
  // domain, email, ip.
  repeated string invalid = 14;
  // Input patterns since the page called the SDK's watch(): clicks_without_movement,
  // centered_clicks, instant_keys, text_without_keys, no_input. Real users can produce each,
  // so they are context, not a verdict. Empty when none matched; unset without watch().
  repeated string behavior = 19;
  // Only with `detail` and an `identification_id`: the identification section of
  // POST /v1/check with `detail: true`.
  IdentificationDetail identification = 21;
  optional string visitor_id = 22;
}

// What the API found for an identification. As everywhere here, an unset field means
// unknown, never false or zero.
message IdentificationDetail {
  // ok, insufficient_signals (valid evidence without a full ID), invalid_input or unavailable.
  optional string status = 1;
  // Why the status is not ok: invalid_identification_id, unknown_identification (also
  // expired), identification_unavailable (Redis could not answer) or invalid_evidence.
  optional string reason = 2;
  // The SDK's fingerprint schema. Unset without a full ID.
  optional uint32 schema_version = 3;
  optional string fingerprint = 4;
  // Unset unless the evidence was valid.
  EvidenceSummary evidence = 5;
  optional bool replayed = 6;
  optional int64 age_ms = 7;
  // The page origin that posted to POST /v1/identify.
  optional string origin = 8;
  // The JA4 of the browser's TLS ClientHello. Unset when none could be read.
  optional string ja4 = 9;
  // The TLS stack the JA4 belongs to: chromium, firefox, apple, curl, python, go or node.
  // Unset when the JA4 is not in the reference table: unknown, not a mismatch.
  optional string tls_client = 10;
  // Each unset when the evidence did not carry that part.
  EvidenceCheck automation = 11;
  EvidenceCheck tampering = 12;
  EvidenceCheck spoofing = 13;
  BehaviorCheck behavior = 14;
  optional string visitor_id = 15;
  Reconciliation reconciliation = 16;
}

message Reconciliation {
  optional string status = 1;
  optional uint32 rule_version = 2;
  optional string visitor_id = 3;
  optional string method = 4;
}

message EvidenceSummary {
  // A hash per complete group of identity probes: fonts, hardware, rendering, software.
  map<string, string> identity_groups = 1;
  optional uint32 included_components = 2;
  optional uint32 included_hints = 3;
  optional uint32 unavailable_probes = 4;
  optional uint32 excluded_probes = 5;
}

// The automation, tampering or spoofing rule.
message EvidenceCheck {
  // detected, not_detected, unknown or invalid_input.
  optional string status = 1;
  optional uint32 rule_version = 2;
  // client_reported, or client_reported_vs_request_headers for spoofing.
  optional string source = 3;
  // The observations that were true.
  repeated string indicators = 4;
  // The observations that could not be made. Their outcome is unknown.
  repeated string unavailable_probes = 5;
  optional string reason = 6;
}

message BehaviorCheck {
  // observed or invalid_input.
  optional string status = 1;
  optional uint32 rule_version = 2;
  optional string source = 3;
  // Same values as CheckResponse.behavior.
  repeated string patterns = 4;
  optional string reason = 5;
}
