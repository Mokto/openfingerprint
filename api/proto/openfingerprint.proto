syntax = "proto3";

package openfingerprint.v1;

// The same compact verdicts as POST /v1/check, on the same listener, over
// Connect (JSON or protobuf, any HTTP version), gRPC and gRPC-Web. gRPC needs
// HTTP/2 without TLS here. There is no authentication: keep the API on a
// private network. Server reflection is available.
service OpenFingerprint {
  rpc Check(CheckRequest) returns (CheckResponse);
  // A single-use nonce for one page: give it to the SDK (`collect({ nonce })`)
  // and Check reports `spoofing` when the token's nonce is not valid.
  rpc CreateNonce(CreateNonceRequest) returns (CreateNonceResponse);
}

message CreateNonceRequest {
  // Lifetime, 60 to 86400 seconds. Default 1800.
  optional uint32 ttl_seconds = 1;
}

message CreateNonceResponse {
  string nonce = 1;
  // Unix seconds.
  int64 expires_at = 2;
}

// At least one field is required. `domain` and `email` are mutually exclusive.
message CheckRequest {
  // The `token` string from the SDK result.
  optional string signals = 1;
  optional string domain = 2;
  optional string email = 3;
  optional string ip = 4;
  // Headers of the browser request that carried `signals`, copied verbatim by
  // the caller. Used only with `signals`, for the `spoofing` check.
  optional RequestHeaders headers = 5;
}

// Each field is the raw value of one HTTP header; unset means the request did
// not carry it.
message RequestHeaders {
  optional string user_agent = 1;
  optional string accept_language = 2;
  optional string sec_ch_ua = 3;
  optional string sec_ch_ua_mobile = 4;
  optional string sec_ch_ua_platform = 5;
}

// An unset field means unknown, not false.
message CheckResponse {
  // Unset when the token is missing, invalid or has no full ID.
  optional string fingerprint = 1;
  optional bool automation = 2;
  optional bool tampering = 3;
  // The token does not belong to the request that carried it: the browser's own
  // report (user agent, client hints, language) contradicts `headers`, or its
  // nonce from CreateNonce is reused, expired, not issued here, or missing when
  // required. Unset when neither is in use or nothing could be compared.
  optional bool spoofing = 18;
  optional bool disposable = 4;
  optional bool free = 5;
  optional bool spam = 6;
  optional bool relay = 7;
  optional bool mx = 8;
  // The domain is on a generic TLD that registrars sell at teaser prices (a first-year price of 3 USD
  // or less). Context for review, not a verdict on the site. Unset for a TLD without a known price.
  optional bool cheap_tld = 15;
  // The same SDK token was checked before, within the replay window. Unset without a token or
  // when Redis cannot say. Catches a captured token submitted again, not a forged one.
  optional bool replayed = 16;
  // Milliseconds from the browser's collection time to now, by the browser's clock: negative
  // when that clock is ahead. Unset when the token has no collection time.
  optional int64 token_age_ms = 17;
  // Lowercase ISO 3166-1 alpha-2 code.
  optional string country = 9;
  optional bool vpn = 10;
  optional bool tor = 11;
  optional bool datacenter = 12;
  optional bool proxy = 13;
  // Inputs that were rejected: signals, automation, tampering, spoofing, headers,
  // domain, email, ip.
  repeated string invalid = 14;
}
