name: CI
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm --dir sdk exec playwright-core install --with-deps chromium firefox webkit
      - run: pnpm test
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --manifest-path api/Cargo.toml --check
      - run: cargo +stable clippy --manifest-path api/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo +stable test --manifest-path api/Cargo.toml --locked
      - run: cargo +stable build --manifest-path api/Cargo.toml --locked
      - run: node api/test.mjs
      - run: node api/test-country.mjs
      - run: node api/test-collection.mjs
        env:
          OPENFINGERPRINT_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      - run: node api/test-network.mjs
        env:
          OPENFINGERPRINT_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      - run: bash api/chart/test.sh
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: bash api/build-images.sh openfingerprint-api:ci openfingerprint-domain-updater:ci openfingerprint-network-updater:ci
