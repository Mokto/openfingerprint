name: Release API
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-api
  cancel-in-progress: false
jobs:
  release-please:
    if: github.repository == 'Mokto/openfingerprint'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # GITHUB_TOKEN-created PRs and tags do not trigger CI/push workflows; dispatch them explicitly.
      - name: Check release PRs
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          branches="$(printf '%s' "$RELEASE_PRS" | jq -er '.[].headBranchName')"
          while IFS= read -r branch; do
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          done <<< "$branches"
      - name: Publish released API image
        if: steps.release.outputs['api--release_created'] == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_TAG: ${{ steps.release.outputs['api--tag_name'] }}
        run: gh workflow run api-image.yml --repo "$GITHUB_REPOSITORY" --ref "$API_TAG"
